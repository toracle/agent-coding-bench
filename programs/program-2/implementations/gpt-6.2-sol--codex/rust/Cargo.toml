[package]
name = "inventory-reservations"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[dependencies]
diesel = { version = "=2.2.12", features = ["sqlite"] }
serde_json = "=1.0.145"
tiny_http = "=0.12.0"
ureq = { version = "=2.12.1", default-features = false }
clap = { version = "=4.5.51", features = ["derive", "env"] }
uuid = { version = "=1.18.1", features = ["v4"] }
